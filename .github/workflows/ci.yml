name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: ./ci.sh install

      - name: Test
        run: ./ci.sh test

      - name: Test summary
        if: always()
        env:
          CI_PY_VERSION: ${{ matrix.python-version }}
        run: ./ci.sh test-summary

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache venv
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-3.13-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: ./ci.sh install

      - name: Generate example reports
        run: ./ci.sh examples

      - name: Build pages site
        run: ./ci.sh build-site

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Report summary
        run: |
          PAGES_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMEOF
          ### 📊 Example Reports

          | Theme | Link |
          |-------|------|
          | ☀️ Light | [example_light.html](${PAGES_URL}/example_light.html) |
          | 🌙 Dark | [example_dark.html](${PAGES_URL}/example_dark.html) |
          | 🔄 Auto | [example_auto.html](${PAGES_URL}/example_auto.html) |
          SUMEOF

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: examples
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
